<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина покупок</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-shopping-cart"></i> Корзина покупок</h1>
        <div class="user-selector">
            <label for="userId">ID пользователя:</label>
            <input type="number" id="userId" value="1" min="1">
            <button onclick="loadCart()">Загрузить корзину</button>
        </div>
    </header>

    <div class="cart-container">
        <div class="cart-info">
            <h2>Ваша корзина <span id="itemCount">0</span> товаров</h2>
            <div class="total">Итого: <span id="total">0</span> ₽</div>
            <div class="actions">
                <button onclick="clearCart()" class="btn-clear">
                    <i class="fas fa-trash"></i> Очистить корзину
                </button>
                <button onclick="checkout()" class="btn-checkout">
                    <i class="fas fa-credit-card"></i> Оформить заказ
                </button>
            </div>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Товары будут загружаться здесь -->
            <div class="empty-cart">
                <i class="fas fa-cart-plus"></i>
                <p>Корзина пуста</p>
            </div>
        </div>
    </div>

    <div class="add-product-form">
        <h3><i class="fas fa-plus"></i> Добавить товар</h3>
        <div class="form-group">
            <input type="number" id="productId" placeholder="ID товара" min="1">
            <input type="text" id="productName" placeholder="Название товара">
            <input type="number" id="price" placeholder="Цена" step="0.01" min="0">
            <input type="number" id="quantity" placeholder="Количество" min="1" value="1">
            <button onclick="addToCart()" class="btn-add">
                <i class="fas fa-cart-plus"></i> Добавить
            </button>
        </div>
    </div>

    <div class="orders-section" id="ordersSection" style="display: none;">
        <h3><i class="fas fa-box"></i> Последний заказ</h3>
        <div class="order-details" id="orderDetails"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
