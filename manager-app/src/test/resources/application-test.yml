spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

  # Отключаем ненужные для тестов функции
  boot:
    admin:
      client:
        enabled: false

  # Упрощенная security для тестов
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://fake-issuer-for-test
      client:
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret

# Отключаем Eureka для тестов
eureka:
  client:
    enabled: false

# Отключаем catalogue service интеграцию
catalogue:
  service:
    url: http://localhost:54321  # WireMock порт