spring:
  application:
    name: manager-app
  boot:
    admin:
      client:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: products
    create-schemas: true
    baseline-on-migrate: true
    jpa:
      hibernate:
        ddl-auto: validate  # или none вместо update
      defer-datasource-initialization: true

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_db
    username: postgres
    password: 1199
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://192.168.1.5:8082/realms/market
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: manager-app
            client-secret: kFML53DPGP1uNUCISj78jmGEt5YbdWMv
            scope:
              - openid
              - view_catalogue
              - edit_catalogue
              - microprofile-jwt
          metrics:
            provider: keycloak
            client-id: manager-app
            client-secret: kFML53DPGP1uNUCISj78jmGEt5YbdWMv
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
      resourceserver:
          jwt:
            issuer-uri: http://192.168.1.5:8082/realms/market

server:
  port: 8083


catalogue:
  service:
    url: lb://catalogue-sevice
    username: product_service
    password: 1199
    registration: keycloak

logging:
  level:
    org.springframework.security: DEBUG

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'

eureka:
  client:
    service-url:
      defaultZone: http://192.168.1.5:8761/eureka/
  instance:
    hostname: 192.168.1.5  # или ваш корректный hostname
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true